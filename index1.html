                }

            <p>PRICE: ${lessPrice[i].price}/-</p>
            <p>DESC: ${lessPrice[i].title}</p>
            <p>Brand : ${lessPrice[i].category}</p>
            <button>BUY NOW</button>
        </div>`
            }
